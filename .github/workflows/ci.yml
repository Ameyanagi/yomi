name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-24.04
          - name: Linux ARM64
            os: ubuntu-24.04-arm
          - name: macOS ARM64
            os: macos-14

    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.76.2
          cache: true
      - name: Verify locked workspace
        run: pixi run --locked check
