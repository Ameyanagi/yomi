name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    name: Check ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-24.04
          - name: Linux ARM64
            os: ubuntu-24.04-arm
          - name: macOS ARM64
            os: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.76.2
          cache: true
      - run: pixi run --locked check

  publish:
    name: Publish source release
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Build source archive
        run: >-
          git archive --format=tar.gz
          --prefix="yomi-${GITHUB_REF_NAME}/"
          --output="yomi-${GITHUB_REF_NAME}.tar.gz"
          "${GITHUB_SHA}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "yomi-${GITHUB_REF_NAME}.tar.gz"
          --verify-tag --generate-notes
          --title "Yomi ${GITHUB_REF_NAME}"
