name: Bug report
description: Report reproducible incorrect behavior.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest Mojo program, inputs, and commands.
      render: mojo
    validations:
      required: true
  - type: input
    id: mojo
    attributes:
      label: Mojo version
      placeholder: mojo 1.0.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS ARM64 or Linux x86-64
    validations:
      required: true
